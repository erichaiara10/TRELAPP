name: Publish Test Site
# Data Sources orphan-lock recovery validation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter PUBLISH_TRELWEB_TEST
        required: true
        type: string
  push:
    branches:
      - codex/staff-sidebar-v14-20261113
      - codex/staff-screens-v14-20261113
      - codex/test-deploy-seven-scoped-fixes
      - codex/aggregation-18-improvements
      - restore/private-workspace-20261111

permissions:
  contents: read

concurrency:
  group: trelweb-test-deployment
  cancel-in-progress: true

jobs:
  validate-build-deploy:
    name: Validate, build and publish trelweb-test
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    environment: fly-test
    env:
      TEST_APP_NAME: trelweb-test
      TEST_URL: https://trelweb-test.fly.dev
      DEPLOY_CONFIRMATION: ${{ github.event_name == 'push' && 'PUBLISH_TRELWEB_TEST' || inputs.confirmation }}

    steps:
      - name: Check confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DEPLOY_CONFIRMATION" != "PUBLISH_TRELWEB_TEST" ]; then
            echo "Test deployment blocked: confirmation text did not match." >&2
            exit 1
          fi

      - name: Check out selected workflow branch
        uses: actions/checkout@v4

      - name: Guard production from test workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f fly.test.toml
          grep -Eq '^app = "trelweb-test"$' fly.test.toml
          if grep -Eq '^app = "trelweb"$' fly.test.toml; then
            echo "Test deployment blocked: production Fly app detected." >&2
            exit 1
          fi
          grep -Eq '^  DB_NAME = "trel_test"$' fly.test.toml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile backend
        working-directory: backend
        shell: bash
        run: python -m compileall -q .

      - name: Install backend test dependencies
        working-directory: backend
        run: pip install -r requirements.txt mongomock-motor

      - name: Verify all scoped Property Data Aggregation changes
        working-directory: backend
        env:
          JWT_SECRET: scoped-test-secret
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: trel_scoped_test
          PYTHONPATH: .
        run: >-
          pytest -q
          tests/test_collectors_common.py
          tests/test_market_aggregation_improvements.py
          tests/test_p3_market_property_link.py
          tests/test_market_aggregation_36.py
          tests/test_private_preview.py
          tests/test_advertiser_draft_roundtrip.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: backend/frontend
        run: |
          corepack enable
          yarn install --non-interactive --frozen-lockfile

      - name: Build frontend
        working-directory: backend/frontend
        env:
          CI: "false"
        run: yarn build

      - name: Install browser for staff screen checks
        working-directory: backend/frontend
        run: yarn playwright install --with-deps chromium

      - name: Check connected staff screens
        working-directory: backend/frontend
        run: node scripts/check-staff-workspace.cjs

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Publish test site
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy
          --config fly.test.toml
          --app "$TEST_APP_NAME"
          --remote-only
          --ha=false

      - name: Verify test site and account protection
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "$TEST_URL/api/" | grep -q '"ok":true'; then
              curl --fail --silent --show-error --output /dev/null "$TEST_URL/add-property"
              for path in /api/auth/me /api/property-advertising/advertiser/drafts/current; do
                status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$TEST_URL$path")
                test "$status" = "401"
              done
              exit 0
            fi
            sleep 10
          done
          echo "Test site did not become healthy in time." >&2
          exit 1

      - name: Publish deployment summary
        if: always()
        shell: bash
        run: |
          deployed_commit="$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
          {
            echo "## TRELPNG test-site deployment"
            echo ""
            echo "- Source branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`$deployed_commit\`"
            echo "- Target: [trelweb-test.fly.dev]($TEST_URL)"
            echo "- Production app \`trelweb\` was not targeted."
          } >> "$GITHUB_STEP_SUMMARY"
