name: Temporary TRELPNG Read-Only Database Backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Create encrypted trel_db backup
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      MONGODB_AUDIT_PASSWORD: ${{ secrets.MONGODB_AUDIT_PASSWORD }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MONGODB_AUDIT_PASSWORD" || { echo "MONGODB_AUDIT_PASSWORD is not configured"; exit 1; }
          test -n "$BACKUP_ENCRYPTION_PASSWORD" || { echo "BACKUP_ENCRYPTION_PASSWORD is not configured"; exit 1; }

      - name: Install pinned MongoDB Database Tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.18.0.tgz" \
            --output mongodb-tools.tgz
          mkdir mongodb-tools
          tar -xzf mongodb-tools.tgz --strip-components=1 -C mongodb-tools
          echo "$PWD/mongodb-tools/bin" >> "$GITHUB_PATH"

      - name: Create read-only database dump
        shell: bash
        run: |
          set -euo pipefail
          config_file="$RUNNER_TEMP/mongodump.yml"
          trap 'rm -f "$config_file"' EXIT
          python3 -c 'import json, os; print("password: " + json.dumps(os.environ["MONGODB_AUDIT_PASSWORD"]))' > "$config_file"
          chmod 600 "$config_file"
          mkdir -p backup_plain
          mongodump \
            --config="$config_file" \
            --uri="mongodb+srv://cluster0.hwzmeqs.mongodb.net/trel_db" \
            --username="trel_p0_audit_20260820" \
            --authenticationDatabase="admin" \
            --db="trel_db" \
            --out="backup_plain" \
            2>&1 | tee mongodump.log

      - name: Verify collection and document totals
        shell: bash
        run: |
          set -euo pipefail
          collection_count="$(find backup_plain/trel_db -maxdepth 1 -type f -name '*.bson' | wc -l | tr -d ' ')"
          document_count="$(grep -oE '\([0-9]+ documents\)' mongodump.log | grep -oE '[0-9]+' | awk '{total += $1} END {print total + 0}')"

          {
            echo "database=trel_db"
            echo "collection_count=$collection_count"
            echo "document_count=$document_count"
            echo "created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "database_tools_version=$(mongodump --version | head -n 1)"
          } | tee backup-manifest.txt

          test "$collection_count" -eq 15 || {
            echo "Expected 15 collections but found $collection_count"
            exit 1
          }
          test "$document_count" -eq 178 || {
            echo "Expected 178 documents but found $document_count"
            exit 1
          }

      - name: Package and encrypt backup
        shell: bash
        run: |
          set -euo pipefail
          tar -czf trel_db_pre_migration_2026-08-20.tar.gz -C backup_plain trel_db
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in trel_db_pre_migration_2026-08-20.tar.gz \
            -out trel_db_pre_migration_2026-08-20.tar.gz.enc \
            -pass env:BACKUP_ENCRYPTION_PASSWORD
          sha256sum trel_db_pre_migration_2026-08-20.tar.gz.enc |
            tee backup-sha256.txt
          rm -rf backup_plain trel_db_pre_migration_2026-08-20.tar.gz mongodump.log

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: trel-db-pre-migration-backup-2026-08-20
          path: |
            trel_db_pre_migration_2026-08-20.tar.gz.enc
            backup-manifest.txt
            backup-sha256.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
