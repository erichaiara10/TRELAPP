name: P3 Integrated Property Validation

on:
  push:
    branches:
      - codex/p3-integrated-property-write-path
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/p3-integrated-property-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-validation:
    name: P3 code and screen validation
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TREL_PROPERTY_STORAGE_MODE: integrated
      JWT_SECRET: p3-ci-validation-only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            motor==3.3.1 pymongo==4.6.3 pytest==8.3.5 pytest-xdist==3.6.1 \
            fastapi==0.110.1 'pydantic>=2.6.4' 'email-validator>=2.2.0' requests==2.32.3 \
            bcrypt==4.1.3 'pyjwt>=2.10.1' python-multipart==0.0.9

      - name: Compile P3 backend
        run: |
          python -m py_compile \
            migrations/p3_integrated_property.py \
            migrations/p3_market_property_link.py \
            core/account_policy.py \
            core/db.py \
            core/integrated_property_service.py \
            core/market_property_link.py \
            core/property_repository.py \
            routes/market.py \
            routes/properties.py \
            routes/files.py \
            routes/referrals.py \
            models.py \
            seed.py

      - name: Run P3 unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest -q tests/test_p3_integrated_property.py tests/test_p3_market_property_link.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: backend/frontend
        run: yarn install --no-lockfile --non-interactive

      - name: Build Add Property screen
        working-directory: backend/frontend
        env:
          CI: "false"
        run: yarn build

      - name: Install browser for P3 end-to-end checks
        working-directory: backend/frontend
        run: yarn playwright install --with-deps chromium

      - name: Run P3 screen and navigation end-to-end checks
        working-directory: backend/frontend
        run: yarn test:e2e

  atlas-dry-run:
    name: P3 Atlas schema dry-run
    if: github.event_name == 'push'
    needs: code-validation
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      MONGO_URL: mongodb+srv://cluster0.hwzmeqs.mongodb.net/trel_db
      DB_NAME: trel_db
      MONGO_USERNAME: trel_schema_migration_20260820
      MONGO_PASSWORD: ${{ secrets.MONGODB_MIGRATION_PASSWORD }}
      MONGO_AUTH_DATABASE: admin
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pymongo==4.6.3
      - name: Verify migration secret exists
        run: test -n "$MONGO_PASSWORD"
      - name: P3 schema extension dry-run
        run: |
          python migrations/p3_integrated_property.py --mode dry-run
          python migrations/p3_market_property_link.py --mode dry-run
