name: Temporary P3 Schema Apply and Relationship Smoke

on:
  push:
    branches:
      - codex/p3-integrated-property-write-path
    paths:
      - ".github/workflows/temporary-p3-schema-apply.yml"

permissions:
  contents: read

jobs:
  apply-verify-smoke:
    name: Apply P3 schema and verify integrated Property graph
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      MONGO_URL: mongodb+srv://cluster0.hwzmeqs.mongodb.net/trel_db
      DB_NAME: trel_db
      MONGO_USERNAME: trel_schema_migration_20260820
      MONGO_PASSWORD: ${{ secrets.MONGODB_MIGRATION_PASSWORD }}
      MONGO_AUTH_DATABASE: admin
      TREL_PROPERTY_STORAGE_MODE: integrated
      PYTHONPATH: ${{ github.workspace }}/backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned database dependencies
        run: pip install pymongo==4.6.3 motor==3.3.1

      - name: Verify migration secret exists
        run: test -n "$MONGO_PASSWORD"

      - name: P3 schema dry-run
        run: python migrations/p3_integrated_property.py --mode dry-run

      - name: Apply P3 schema extension
        run: >-
          python migrations/p3_integrated_property.py
          --mode apply
          --confirmation APPLY_TREL_DB_P3

      - name: Verify P3 schema extension
        run: python migrations/p3_integrated_property.py --mode verify

      - name: Verify integrated Property relationships
        run: >-
          python tests/p3_relationship_smoke.py
          --confirmation RUN_TREL_P3_SMOKE
