name: One-Time TRELPNG P1 Schema Apply

on:
  push:
    branches:
      - codex/p1-schema-apply-once
    paths:
      - .github/workflows/temporary-p1-schema-apply-once.yml
      - backend/migrations/schema_extension.py

permissions:
  contents: read

jobs:
  schema-extension:
    name: P1 schema extension (approved apply)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      MONGO_PASSWORD: ${{ secrets.MONGODB_MIGRATION_PASSWORD }}
      MONGO_USERNAME: trel_schema_migration_20260820
      MONGO_AUTH_DATABASE: admin
      DB_NAME: trel_db

    steps:
      - name: Check out approved source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard one-time execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/p1-schema-apply-once" || { echo "Unexpected branch"; exit 1; }
          test -n "$MONGO_PASSWORD" || { echo "MONGODB_MIGRATION_PASSWORD is not configured"; exit 1; }
          git merge-base --is-ancestor 72ef688be0aa7371eadd424b62efa379056158a6 HEAD || { echo "Approved migration source is not present"; exit 1; }

      - name: Install migration dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet pymongo==4.6.3

      - name: Apply approved P1 schema extension
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m migrations.schema_extension \
            --mode apply \
            --uri "mongodb+srv://cluster0.hwzmeqs.mongodb.net/trel_db" \
            --username "$MONGO_USERNAME" \
            --auth-database "$MONGO_AUTH_DATABASE" \
            --database "$DB_NAME" | tee schema-extension-result.json

      - name: Verify integrated physical schema
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m migrations.schema_extension \
            --mode verify \
            --uri "mongodb+srv://cluster0.hwzmeqs.mongodb.net/trel_db" \
            --username "$MONGO_USERNAME" \
            --auth-database "$MONGO_AUTH_DATABASE" \
            --database "$DB_NAME" | tee schema-verification-result.json

      - name: Upload non-sensitive execution reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trelpng-p1-schema-extension-approved-apply
          path: |
            backend/schema-extension-result.json
            backend/schema-verification-result.json
          if-no-files-found: error
          retention-days: 7
