name: Close scoped test property

on:
  push:
    branches:
      - codex/test-close-available-sold

permissions:
  contents: read

jobs:
  close-and-verify:
    runs-on: ubuntu-22.04
    environment: fly-test
    env:
      TEST_APP_NAME: trelweb-test
      TEST_URL: https://trelweb-test.fly.dev
      SCRIPT_B64: 
    steps:
      - uses: actions/checkout@v4

      - name: Guard production from scoped test action
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^app = "trelweb-test"$' fly.test.toml
          if grep -Eq '^app = "trelweb"$' fly.test.toml; then
            echo "Blocked: production Fly app detected." >&2
            exit 1
          fi

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Mark the scoped property sold and verify closure
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$TEST_URL/api/" > /dev/null
          flyctl ssh console \
            --app "$TEST_APP_NAME" \
            --command "python -c \"import base64;exec(base64.b64decode('$SCRIPT_B64'))\""
