# TRELPNG test environment. This file must never target the production app
# (`trelweb`) or the production database (`trel_db`).
app = "trelweb-test"
primary_region = "syd"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  DB_NAME = "trel_test"
  TREL_PROPERTY_STORAGE_MODE = "integrated"

[http_service]
  internal_port = 8000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
