# fly.toml app configuration file generated for trelweb on 2026-07-27T12:38:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trelweb'
primary_region = 'iad'

#[build]
#  builder = 'python'

[env]
  PORT = '8080'

[processes]
  app = 'uvicorn server:app --host 0.0.0.0 --port 8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
