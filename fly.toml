# fly.toml app configuration file generated for trelapp on 2026-07-27T11:26:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "trelweb"
primary_region = "syd"

[build]
  dockerfile = "backend/Dockerfile"

[http_service]
  auto_start_machines = true
  auto_stop_machines = false
  force_https = true
  internal_port = 8000
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
  memory_mb = 1024
